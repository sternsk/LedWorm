[pioarduino]
name = LedWorm
; verhindere, dass bereits kompilierte Framework-Dateien bei Änderungen an der platformio.ini jedes Mal komplett neu gebaut werden müssen.
build_cache_dir = ~/.pio/build_cach
[env:LedWorm]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

board = esp32-s3-devkitc-1
framework =espidf

;upload_port = COM7
;monitor_port = COM7