<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledworm Controller</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 20px; user-select: none; padding-bottom: 240px; }
        h1 { color: #00ffff; }
        .container { max-width: 400px; margin: 0 auto; }
        
        .status-box { background: #333; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .slider-container { display:flex; flex-direction:column; align-items:center; gap:8px; margin-left:20px; }
        #value-slider { height:140px; direction:rtl; }
        .status-val { color: #00ffff; font-weight: bold; }
        
        .join-box { background: #333; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #555; background: #444; color: #fff; font-size: 16px; }
        input[type="text"]:focus { border-color: #00ffff; outline: none; }
        
        button { background: #00ffff; color: #222; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        #btn-join { width: 100%; border-radius: 50px; }
        
        /* Joystick am unteren Bildschirmrand fixiert */
        .bottom-controls { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, #1a1a1a 20%); padding-bottom: 30px; display: flex; justify-content: center; z-index: 100; }
        #joystick-zone { width: 180px; height: 180px; background: rgba(51, 51, 51, 0.9); border-radius: 50%; position: relative; border: 3px solid #555; touch-action: none; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #joystick-stick { width: 54px; height: 54px; background: #00ffff; border-radius: 50%; position: absolute; top: 60px; left: 60px; box-shadow: 0 0 15px #00ffff; cursor: pointer; }
        
        /*Creating a custom range slider with only CSS - https://blog.logrocket.com/creating-custom-css-range-slider-javascript-upgrades/ */
        input[type="range"] {
        /* removing default appearance */
        -webkit-appearance: none;
        appearance: none; 
        /* creating a custom design */
        cursor: pointer;
        outline: none;
        writing-mode: vertical-rl;
        /*  slider progress trick  */
        overflow: hidden;
        border-radius: 16px;
        }

        /* Track: webkit browsers */
        input[type="range"]::-webkit-slider-runnable-track {
        height: 15px;
        background: #555;
        border-radius: 16px;
        }

        /* Track: Mozilla Firefox */
        input[type="range"]::-moz-range-track {
        height: 15px;
        background: #555;
        border-radius: 16px;
        }

        /* Thumb: webkit */
        input[type="range"]::-webkit-slider-thumb {
        /* removing default appearance */
        -webkit-appearance: none;
        appearance: none; 
        /* creating a custom design */
        height: 15px;
        width: 18px;
        background-color: #00ffff;
        border-radius: 50%;
        border: 2px solid #555;
        /*  slider progress trick  */
        box-shadow: -407px 0 0 400px #555;
        }


        /* Thumb: Firefox */
        input[type="range"]::-moz-range-thumb {
        height: 15px;
        width: 15px;
        background-color: #555;
        border-radius: 50%;
        border: 1px solid #555;
        /*  slider progress trick  */
        box-shadow: -407px 0 0 400px #00ffff;
        }


        /*=============
        Aesthetics 
        =========================*/

        body {
        font-family: system-ui;
        }

        h1 {
        color: #4b4949; 
        text-align: center;
        }

        .wrapper {
        color: #4b4949; 
        background: #00ffff;
        max-width: 400px;
        width: 100%;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto;
        }

        .range {
        display: flex;
        align-items: center;
        max-width: 500px;
        height: 4rem;
        width: 80%;
        background: #555;
        padding: 0px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ledworm Steuerung</h1>
        
        <div class="status-box">
            <div class="status-row">
                <span>Aktive Spieler auf dem Server:</span>
                <span id="player-count" class="status-val">0</span>
            </div>
            <div class="status-row" id="my-id-row" style="display:none;">
                <span>Deine Spieler-ID:</span>
                <span id="my-id-val" class="status-val">-</span>
            </div>
        </div>

        <div class="status-box" aria-label="Dein Wurm">
            <div class="status-row"><span>Verbindung:</span><span id="connection-state" class="status-val" role="status">Verbinde …</span></div>
            <div class="status-row"><span>Punkte:</span><output id="worm-score" class="status-val">–</output></div>
            <div class="status-row"><span>Länge:</span><output id="worm-length" class="status-val">–</output></div>
            <div class="status-row"><span>Helligkeit (0–255):</span><output id="worm-brightness" class="status-val">–</output></div>
        </div>
        <div class="join-box">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px;">
                <span>Hintergrundfarbe:</span>
                <!-- HTML5 Farbauswahlfeld -->
                <input type="color" id="ambient-color-input" value="#000000" style="width: 80px; height: 40px; border: none; cursor: pointer;">
            </div>
        </div>
        <div class="join-box">
            <form id="marquee-form">
                <label for="marquee-text">Lauftext auf der Matrix:</label>
                <div class="input-group">
                    <input type="text" id="marquee-text" maxlength="32" autocomplete="off"
                           placeholder="LEDWORM">
                    <button type="submit" id="marquee-send" disabled>Anzeigen</button>
                </div>
                <small>Bis zu 32 Zeichen. Ein leeres Feld beendet den Lauftext.</small>
                <p id="marquee-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <div class="container status-box" id="wifi-reset-section" hidden>
        <button type="button" id="wifi-reset" disabled>WLAN zurücksetzen</button>
        <p id="wifi-action-description">Entfernt die gespeicherten WLAN-Zugangsdaten und startet LedWorm neu.</p>
        <p id="wifi-reset-status" role="status" aria-live="polite"></p>
    </div>

    <div class="bottom-controls">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <!-- Ein vertikaler Schieberegler von 0 bis 255 -->
        <div class="slider-container">
            <label for="value-slider">Deine Helligkeit</label>
            <input type="range" id="value-slider" min="0" max="255" step="1" value="63" disabled>
            <output id="brightness-preview" for="value-slider">–</output>
        </div>
    </div>
    
    <script>
        let ws;
        let wifiResetComplete = false;
        let wifiResetPending = false;
        let offlineGame = false;
        const wifiResetButton = document.getElementById('wifi-reset');
        const wifiResetStatus = document.getElementById('wifi-reset-status');
        const wifiResetSection = document.getElementById('wifi-reset-section');
        wifiResetButton.addEventListener('click', async () => {
            if (offlineGame) {
                if (wifiResetButton.disabled || !window.confirm('Zur WLAN-Auswahl wechseln? Alle Spieler werden getrennt.')) return;
                wifiResetPending = true;
                wifiResetButton.disabled = true;
                wifiResetStatus.textContent = 'WLAN-Auswahl wird geöffnet …';
                try {
                    const response = await fetch('/api/wifi/select', {method:'POST'});
                    if (!response.ok) throw new Error('setup failed');
                    for (let attempt = 0; attempt < 20; attempt++) {
                        await new Promise(resolve => setTimeout(resolve, 500));
                        try {
                            const setup = await fetch('/setup', {cache:'no-store'});
                            if (setup.ok) { window.location.replace('/setup'); return; }
                        } catch { /* HTTP server switching */ }
                    }
                    throw new Error('setup unavailable');
                } catch {
                    wifiResetPending = false;
                    wifiResetButton.disabled = false;
                    wifiResetStatus.textContent = 'WLAN-Auswahl nicht bestätigt. Öffne http://192.168.4.1/ erneut.';
                }
                return;
            }
            if (wifiResetButton.disabled || !window.confirm(
                'WLAN-Zugangsdaten löschen und LedWorm neu starten? Alle Spieler werden getrennt.')) return;
            wifiResetButton.disabled = true;
            wifiResetPending = true;
            wifiResetStatus.textContent = 'WLAN wird zurückgesetzt …';
            try {
                const response = await fetch('/api/wifi/reset', {
                    method: 'POST', headers: {'X-LedWorm-Reset': 'confirm'}
                });
                if (!response.ok) throw new Error('reset failed');
                wifiResetComplete = true;
                wifiResetStatus.textContent = 'WLAN gelöscht. LedWorm startet neu. Verbinde dich mit LedWorm-Setup und öffne http://192.168.4.1/.';
            } catch {
                wifiResetPending = false;
                wifiResetStatus.textContent = 'Zurücksetzen nicht bestätigt. Prüfe, ob LedWorm-Setup verfügbar ist, oder versuche es erneut.';
                wifiResetButton.disabled = false;
            }
        });
        const stick = document.getElementById('joystick-stick');
        const zone = document.getElementById('joystick-zone');
        const playerCount = document.getElementById('player-count');
        const myIdRow = document.getElementById('my-id-row');
        const myIdVal = document.getElementById('my-id-val');
        const connectionState = document.getElementById('connection-state');
        const wormScore = document.getElementById('worm-score');
        const wormLength = document.getElementById('worm-length');
        const wormBrightness = document.getElementById('worm-brightness');
        const brightnessPreview = document.getElementById('brightness-preview');
        const ambientColorInput = document.getElementById('ambient-color-input');
        const valueSlider = document.getElementById('value-slider');
        const marqueeForm = document.getElementById('marquee-form');
        const marqueeText = document.getElementById('marquee-text');
        const marqueeSend = document.getElementById('marquee-send');
        const marqueeStatus = document.getElementById('marquee-status');

        marqueeForm.onsubmit = event => {
            event.preventDefault();
            const text = marqueeText.value;
            if (!/^[\x20-\x7e]{0,32}$/.test(text)) {
                marqueeStatus.textContent = 'Bitte höchstens 32 einfache Zeichen verwenden.';
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                marqueeStatus.textContent = 'Keine Verbindung zu LedWorm.';
                return;
            }
            ws.send(JSON.stringify({type:'marquee_text', text}));
            marqueeStatus.textContent = text ? 'Lauftext wird angezeigt.' : 'Lauftext wurde beendet.';
        };
        
        let stateTimer;
        let haveState = false;
        let adjustingBrightness = false;
        let active = false;
        let startX, startY;

        function initWebSocket() {
            ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws`);
            ws.onopen = () => {
                connectionState.textContent = 'Verbunden';
                marqueeSend.disabled = false;
                const requestState = () => {
                    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'state'}));
                };
                requestState();
                stateTimer = setInterval(requestState, 200);
            };
            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch { return; }
                if (data.type !== 'player_state') return;
                offlineGame = data.can_reset_wifi === false;
                wifiResetSection.hidden = typeof data.can_reset_wifi !== 'boolean';
                wifiResetButton.textContent = offlineGame ? 'WLAN-Auswahl' : 'WLAN zurücksetzen';
                document.getElementById('wifi-action-description').textContent = offlineGame
                    ? 'Beendet das Offline-Spiel und öffnet die WLAN-Einrichtung. Gespeicherte Zugangsdaten bleiben erhalten.'
                    : 'Entfernt die gespeicherten WLAN-Zugangsdaten und startet LedWorm neu.';
                wifiResetButton.disabled = wifiResetSection.hidden || wifiResetPending || wifiResetComplete;
                haveState = true;
                playerCount.textContent = data.count;
                myIdRow.style.display = 'flex';
                myIdVal.textContent = data.id;
                wormScore.textContent = data.score;
                wormLength.textContent = data.length;
                wormBrightness.textContent = `${data.brightness} (${Math.round(data.brightness / 255 * 100)} %)`;
                valueSlider.disabled = false;
                if (!adjustingBrightness) {
                    valueSlider.value = data.brightness;
                    brightnessPreview.textContent = data.brightness;
                }
            };
            ws.onclose = () => {
                clearInterval(stateTimer);
                wifiResetSection.hidden = true;
                wifiResetButton.disabled = true;
                haveState = false;
                active = false;
                adjustingBrightness = false;
                stick.style.left = stick.style.top = '60px';
                connectionState.textContent = 'Getrennt – verbinde erneut …';
                myIdRow.style.display = 'none';
                playerCount.textContent = '–';
                wormScore.textContent = wormLength.textContent = wormBrightness.textContent = '–';
                brightnessPreview.textContent = '–';
                valueSlider.disabled = true;
                marqueeSend.disabled = true;
                if (wifiResetComplete) {
                    connectionState.textContent = 'WLAN zurückgesetzt';
                } else {
                    if (!wifiResetPending) setTimeout(initWebSocket, 2000);
                }
            };
        }

        // Joystick Logik 
        zone.addEventListener('touchstart', startMove, {passive: false});
        window.addEventListener('touchend', endMove);
        window.addEventListener('touchmove', move, {passive: false});
        zone.addEventListener('mousedown', startMove);
        window.addEventListener('mouseup', endMove);
        window.addEventListener('mousemove', move);

        function startMove(e) {
            if (!haveState) return;
            active = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Berechnet den Startpunkt relativ zum Mittelpunkt der Joystick-Zone
            const rect = zone.getBoundingClientRect();
            startX = rect.left + 60; // 60px ist der voreingestellte Offset (Radius + halber Stick)
            startY = rect.top + 60;
            
            if(e.cancelable) e.preventDefault();
        }

        function endMove() {
            if (!active) return;
            active = false;
            stick.style.left = '60px';
            stick.style.top = '60px';
            sendJoystickData(0, 0);
        }

        function move(e) {
            if (!active) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Berechne den Abstand vom fixierten Mittelpunkt der Zone
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxLen = 60; // Maximale Auslenkung in Pixeln

            // Begrenzung des Sticks auf den Kreisradius
            if (dist > maxLen) {
                dx = (dx / dist) * maxLen;
                dy = (dy / dist) * maxLen;
            }
               // Positioniere den Stick visuell (relativ zur oberen linken Ecke der Zone)
            stick.style.left = (60 + dx) + 'px';
            stick.style.top = (60 + dy) + 'px';

            // Normalisiere die Werte für den ESP32 (-1.0 bis 1.0)
            const normX = (dx / maxLen).toFixed(2);
            const normY = ((dy / maxLen) * -1).toFixed(2); // Y-Achse invertieren für klassische Koordinaten
            
            sendJoystickData(normX, normY);
            if(e.cancelable) e.preventDefault();
        }

        function sendJoystickData(x, y) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "joystick", x: parseFloat(x), y: parseFloat(y) }));
            }
        }


        // Reagiert, wenn der Benutzer die Farbe im Auswahlfeld ändert
        ambientColorInput.addEventListener('input', (e) => {
            const hexColor = e.target.value; // Liefert einen String wie "#ff0000"
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "ambient_color",
                    hex: hexColor
                }));
            }
        });

        valueSlider.addEventListener('pointerdown', () => { adjustingBrightness = true; });
        window.addEventListener('pointerup', () => { adjustingBrightness = false; });
        window.addEventListener('pointercancel', () => { adjustingBrightness = false; });
        valueSlider.addEventListener('input', (event) => {
            const value = Number(event.target.value);
            brightnessPreview.textContent = value;
            if (haveState && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type:'value', value}));
            }
        });

        window.onload = initWebSocket;
    </script>
</body>
</html>
