<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledworm Controller</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #222; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            user-select: none; 
        }

        h1 { color: #00ffff; }

        .container { max-width: 400px; margin: 0 auto; }

        #joystick-zone { 
            width: 200px; 
            height: 200px; 
            background: #333; 
            border-radius: 50%; 
            margin: 20px auto; 
            position: relative; 
            border: 3px solid #555; 
            touch-action: none; 
        }

        #joystick-stick { 
            width: 60px; 
            height: 60px; 
            background: #00ffff; 
            border-radius: 50%; 
            position: absolute; 
            top: 70px; 
            left: 70px; 
            box-shadow: 0 0 15px #00ffff; 
            cursor: pointer; 
        }

        .player-box { background: #333; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
        .player-item { padding: 5px 0; border-bottom: 1px solid #444; display: flex; align-items: center; }
        .player-item.me { color: #00ffff; font-weight: bold; }
        .player-item input { margin-right: 10px; }

        button { 
            background: #00ffff; 
            color: #222; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 0 10px rgba(0,255,255,0.4); 
            width: 100%; 
        }

        button:active { background: #00b3b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Play Ledworm Invasion!</h1>
        
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>

        <div class="player-box">
            <h3>players online</h3>
            <div id="player-list">
                <!-- Dynamisch via JS -->
            </div>
        </div>

        <button id="btn-add-player">Neuen Spieler hinzufügen</button>
    </div>

    <script>
        let ws;
        const stick = document.getElementById('joystick-stick');
        const zone = document.getElementById('joystick-zone');
        const playerList = document.getElementById('player-list');
        const btnAdd = document.getElementById('btn-add-player');
        
        let myId = "player_1"; // Beispielhaft initialisiert, wird vom Server überschrieben
        let active = false;
        let startX, startY;

        // WebSocket Verbindung aufbauen
        function initWebSocket() {
            ws = new WebSocket(`ws://${window.location.hostname}/ws`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "players") {
                    renderPlayers(data.list, data.myId);
                }
            };
            ws.onclose = () => setTimeout(initWebSocket, 2000); // Auto-Reconnect
        }

        function renderPlayers(list, serverMyId) {
            myId = serverMyId;
            playerList.innerHTML = '';
            list.forEach(p => {
                const div = document.createElement('div');
                div.className = `player-item ${p.id === myId ? 'me' : ''}`;
                div.innerHTML = `<input type="checkbox" checked disabled> 
                    <span>${p.name} ${p.id === myId ? '(Du)' : ''}</span>`;
                playerList.appendChild(div);
            });
        }

        // Joystick Logik
        zone.addEventListener('touchstart', startMove, {passive: false});
        window.addEventListener('touchend', endMove);
        window.addEventListener('touchmove', move, {passive: false});

        zone.addEventListener('mousedown', startMove);
        window.addEventListener('mouseup', endMove);
        window.addEventListener('mousemove', move);

        function startMove(e) {
            active = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - stick.offsetLeft;
            startY = clientY - stick.offsetTop;
            if(e.cancelable) e.preventDefault();
        }

        function endMove() {
            if (!active) return;
            active = false;
            stick.style.left = '70px';
            stick.style.top = '70px';
            sendJoystickData(0, 0);
        }

        function move(e) {
            if (!active) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let x = clientX - startX;
            let y = clientY - startY;
            
            // Begrenzung auf den Kreisradius (70px max Auslenkung)
            const dx = x - 70;
            const dy = y - 70;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 70) {
                x = 70 + (dx / dist) * 70;
                y = 70 + (dy / dist) * 70;
            }
            
            stick.style.left = x + 'px';
            stick.style.top = y + 'px';

            // Werte normalisieren (-1.0 bis 1.0)
            const normX = ((x - 70) / 70).toFixed(2);
            const normY = (((y - 70) / 70) * -1).toFixed(2); // Y-Achse invertieren für klassische Koordinaten
            
            sendJoystickData(normX, normY);
            if(e.cancelable) e.preventDefault();
        }

        function sendJoystickData(x, y) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "joystick", x: parseFloat(x), y: parseFloat(y) }));
            }
        }

        btnAdd.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "add_player" }));
            }
        });

        window.onload = initWebSocket;
    </script>
</body>
</html>
